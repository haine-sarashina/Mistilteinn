[package]
name = "mistilteinn"
version = "0.3.0"
edition = "2024"
authors = ["haine"]
license = "MIT"
default-run = "mistilteinn"

[lib]
name = "mistilteinn"
path = "src/lib.rs"

[[bin]]
name = "mistilteinn"
path = "src/main.rs"

[dependencies]
# Window management
winit = "0.30"
arboard = "3.4"

# GPU rendering
wgpu = "0.20"

# HTML parsing
html5ever = "0.29"
markup5ever = "0.14"
rustc-hash = "2.0"

# CSS parsing
cssparser = "0.34"
cssparser-color = "0.3"

# Async HTTP client
reqwest = { version = "0.12", features = ["cookies", "json", "stream"] }
# Character encodings for non-UTF-8 pages (Shift_JIS, EUC-JP, …)
encoding_rs = "0.8"
tokio = { version = "1", features = ["full"] }
# WebSocket client. Native TLS to match the HTTP client, so one trust store
# serves both rather than two disagreeing about the same certificate.
tokio-tungstenite = { version = "0.23", features = ["native-tls"] }
futures = "0.3"

# Image loading
image = "0.25"
resvg = "0.44"

# Text layout
parley = "0.3"
fontdb = "0.23"
swash = { version = "0.2", default-features = false, features = ["scale", "render"] }

# Utility
log = "0.4"
env_logger = "0.11"
thiserror = "2.0"
smallvec = "1.13"
hashbrown = "0.15"
bytemuck = "1.14"

# Auto-update
self_update = { version = "0.41", features = ["archive-zip", "compression-zip-deflate", "rustls"] }
rfd = "0.14"
boa_engine = "0.19"
boa_gc = "0.19"
flate2 = "1"
[features]
memprof = []
